# Prints the status and log tail of the latest EAS iOS build, so failures can be read
# from GitHub. Trigger with a commit whose message contains [ios logs], or from the Actions tab.
name: iOS build logs

on:
  push:
    branches: [claude/modernize-ios-mvp]
  workflow_dispatch:

jobs:
  logs:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios logs]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # eas reads app.json plugins, which needs the project's packages installed.
      - run: npm ci
      - name: Recent builds and errors
        run: |
          eas build:list --platform ios --limit 3 --json --non-interactive > builds.json
          node scripts/eas-build-report.mjs builds.json
