# Full iOS build, uploaded to TestFlight. Needed when native code or app config changes;
# JavaScript-only fixes ship faster through the OTA update workflow.
# Trigger with a commit on the app branch whose message contains [ios build],
# or from the Actions tab.
name: iOS build → TestFlight

on:
  push:
    branches: [claude/modernize-ios-mvp]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Queues the cloud build and submits it to TestFlight when it finishes.
      - run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
