# End-to-end tests: builds the iOS app for the simulator on a GitHub macOS runner (free for
# public repos) with the offline gyms backend, then runs the Maestro flows in .maestro/.
# Trigger with a commit whose message contains [e2e], or from the Actions tab.
name: E2E (Maestro)

on:
  push:
    branches: [claude/modernize-ios-mvp]
  workflow_dispatch:

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
    # EAS builds with Xcode 26.5; the macos-15 image stops at 26.3, which can't compile SDK 57.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_GYMS_BACKEND: local
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      NODE_ENV: production
      # A fresh CI simulator can take minutes before Maestro's driver answers (default is 120s).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Match EAS (Xcode 26.5): use the newest Xcode on the runner.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"

      # ios/ is generated (Continuous Native Generation), only inside CI.
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
          status=0
          xcodebuild -workspace ios/Gymmy.xcworkspace -scheme Gymmy -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            > xcodebuild.log 2>&1 || status=$?
          echo "xcodebuild exit: $status"
          grep -nE "error:|fatal error|\*\* BUILD" xcodebuild.log | head -60 || true
          tail -n 25 xcodebuild.log
          exit $status

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8')).devices;
            const ios = Object.keys(d).filter((k) => k.includes('iOS')).sort().reverse();
            for (const k of ios) { const p = d[k].find((x) => x.name.startsWith('iPhone')); if (p) { console.log(p.udid); break; } }")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Gymmy.app
          # Open and close the app once so the first flow doesn't pay for the cold start.
          xcrun simctl launch "$UDID" com.davidh216.gymmy || true
          sleep 20
          xcrun simctl terminate "$UDID" com.davidh216.gymmy || true

      - name: Run Maestro flows
        run: maestro test .maestro --format junit --output maestro-report.xml --debug-output maestro-debug --flatten-debug-output

      # Artifacts can't always be downloaded, so print what was on screen when a flow failed.
      - name: Show the screen after a failure
        if: failure()
        run: |
          # Each flow's steps with their status; the failing step and its error come last.
          find maestro-debug ~/.maestro/tests -name 'commands-*.json' 2>/dev/null | while read -r f; do
            echo "== $f"
            python3 - "$f" <<'PY' || true
          import json, sys
          for c in json.load(open(sys.argv[1])):
              meta = c.get('metadata', {})
              status = meta.get('status', '?')
              if status in ('COMPLETED', 'SKIPPED'):
                  continue
              cmd = next(iter(c.get('command', {}).values()), {}) or {}
              label = cmd.get('label') or cmd.get('description') or json.dumps(cmd)[:160]
              err = (meta.get('error') or {}).get('message', '')
              print(f'  {status}: {label} {err}'[:400])
          PY
          done
          # A crash report means the app died rather than a selector missing.
          echo "== App crash reports"
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i gymmy | head -5 || true
          latest=$(ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i gymmy | head -1)
          if [ -n "$latest" ]; then
            grep -E '"(exception|termination|type|signal|codes|indicator|reason)"|asi|abort|RCTFatal|JavaScript' \
              ~/Library/Logs/DiagnosticReports/"$latest" | head -40 || true
          fi
          echo "== Elements on screen now"
          maestro hierarchy 2>/dev/null | grep -oE '"(accessibilityText|text|resource-id|title|value)" *: *"[^"]+"' | sort -u | head -150 || true
          echo "== After replaying the workout up to ticking the set"
          maestro test .maestro/debug/tick.yaml || true
          maestro hierarchy 2>/dev/null | grep -oE '"(accessibilityText|text|resource-id|title|value)" *: *"[^"]+"' | sort -u | head -150 || true
          echo "== After replaying the workout through Finish and Done"
          maestro test .maestro/debug/finish.yaml || true
          maestro hierarchy 2>/dev/null | grep -oE '"(accessibilityText|text|resource-id|title|value)" *: *"[^"]+"' | sort -u | head -150 || true

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            xcodebuild.log
            maestro-debug
            ~/.maestro/tests
          if-no-files-found: ignore
