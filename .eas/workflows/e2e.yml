# End-to-end tests: a simulator build (offline gyms backend, no signing) driven by Maestro.
# Started from GitHub with a commit containing the e2e marker, or `eas workflow:run e2e.yml`.
name: E2E

jobs:
  build:
    name: iOS simulator build
    type: build
    params:
      platform: ios
      profile: e2e

  maestro:
    name: Maestro flows
    needs: [build]
    type: maestro
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path:
        - .maestro/onboarding.yaml
        - .maestro/log-workout.yaml
        - .maestro/check-in.yaml
        - .maestro/plan-session.yaml
        - .maestro/custom-exercise.yaml
