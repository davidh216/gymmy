# docker-compose.yml for Gymmy's Phase 4: 1% Better Core System
# Complete ML-powered improvement detection system

version: '3.8'

services:
  # ==============================================================================
  # MAIN APPLICATION
  # ==============================================================================
  gymmy-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: gymmy-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://gymmy:gymmy_password@postgres:5432/gymmy
      - REDIS_URL=redis://redis:6379
      - QUEUE_REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-gymmy-phase4-secret-key}
      - LOG_LEVEL=info
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      - ML_CACHE_ENABLED=true
      - ENABLE_REAL_TIME_PROCESSING=true
      - ENABLE_BATCH_PROCESSING=true
      - ENABLE_ML_PREDICTIONS=true
      - ENABLE_ANALYTICS=true
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
    networks:
      - gymmy-network
    healthcheck:
      test: ["CMD", "node", "dist/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==============================================================================
  # DATABASE
  # ==============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: gymmy-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=gymmy
      - POSTGRES_USER=gymmy
      - POSTGRES_PASSWORD=gymmy_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - gymmy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymmy -d gymmy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # REDIS (CACHE & QUEUE)
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: gymmy-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - gymmy-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # MONITORING & METRICS
  # ==============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: gymmy-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gymmy-network

  grafana:
    image: grafana/grafana:latest
    container_name: gymmy-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - gymmy-network

  # ==============================================================================
  # LOG AGGREGATION
  # ==============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: gymmy-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - gymmy-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: gymmy-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - gymmy-network

  # ==============================================================================
  # MESSAGE QUEUE (OPTIONAL)
  # ==============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gymmy-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=gymmy
      - RABBITMQ_DEFAULT_PASS=gymmy_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - gymmy-network

  # ==============================================================================
  # LOAD BALANCER (PRODUCTION)
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: gymmy-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gymmy-backend
    networks:
      - gymmy-network

  # ==============================================================================
  # DEVELOPMENT TOOLS (OPTIONAL)
  # ==============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gymmy-pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@gymmy.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - gymmy-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: gymmy-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis_password
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - gymmy-network

# ==============================================================================
# VOLUMES
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  rabbitmq_data:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================
networks:
  gymmy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
