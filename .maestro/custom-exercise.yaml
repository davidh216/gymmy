appId: com.davidh216.gymmy
name: Create a custom exercise from the picker
---
- runFlow: common/onboard.yaml
- scrollUntilVisible:
    element: "Start empty workout"
    direction: DOWN
    centerElement: true
- tapOn: "Start empty workout"
- tapOn: "Add exercises"
- tapOn: "Search exercises"
- inputText: "Landmine"
- hideKeyboard
- tapOn: ".*Create .Landmine.*"
- hideKeyboard
- scrollUntilVisible:
    element: "Save exercise"
    direction: DOWN
    centerElement: true
- tapOn: "Save exercise"
- assertVisible: ".*Landmine.*"
- assertVisible:
    id: "set-1-weight"
