appId: com.davidh216.gymmy
name: Log a set and finish a workout
---
- runFlow: common/onboard.yaml
- scrollUntilVisible:
    element: "Start empty workout"
    direction: DOWN
    centerElement: true
- tapOn: "Start empty workout"
- tapOn: "Add exercises"
- tapOn: "Search exercises"
- inputText: "squat"
- hideKeyboard
- tapOn: "Back Squat.*"
- tapOn: "Add 1 exercise"
# Number pads have no Return key, so the keyboard stays up; the set row sits above it.
- tapOn:
    id: "set-1-weight"
- inputText: "225"
- tapOn:
    id: "set-1-reps"
- inputText: "5"
- tapOn:
    id: "set-1-done"
# Confirms the set registered before finishing (the header counts done sets).
- extendedWaitUntil:
    visible: "1 set done.*"
    timeout: 5000
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Finish"
# The summary celebrates first, so give it a moment. Stat labels are uppercased on iOS, and Done
# sits below the rewards, so match case-insensitively and scroll to it.
- extendedWaitUntil:
    visible: "(?i).*duration.*"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Back Squat.*"
    direction: DOWN
    timeout: 40000
- scrollUntilVisible:
    element: "Done"
    direction: DOWN
    timeout: 40000
    centerElement: true
- tapOn: "Done"
# Back on Today, still scrolled down to where the workout was started from.
- scrollUntilVisible:
    element:
      id: "today"
    direction: UP
# Recent sits near the bottom, where the floating tab bar overlaps it.
- scrollUntilVisible:
    element: "(?i)recent"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 50
