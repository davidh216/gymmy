appId: com.davidh216.gymmy
name: Log a set and finish a workout
---
- runFlow: common/onboard.yaml
- scrollUntilVisible:
    element: "Start empty workout"
    direction: DOWN
    centerElement: true
- tapOn: "Start empty workout"
- tapOn: "Add exercises"
- tapOn: "Search exercises"
- inputText: "squat"
- hideKeyboard
- tapOn: "Back Squat.*"
- tapOn: "Add 1 exercise"
# Number pads have no Return key, so the keyboard stays up; the set row sits above it.
- tapOn:
    id: "set-1-weight"
- inputText: "225"
- tapOn:
    id: "set-1-reps"
- inputText: "5"
- tapOn:
    id: "set-1-done"
- tapOn:
    text: "Skip"
    optional: true
- tapOn: "Finish"
- assertVisible: "Done"
- assertVisible: ".*Back Squat.*"
- tapOn: "Done"
- assertVisible:
    id: "today"
- scrollUntilVisible:
    element: "(?i)recent"
    direction: DOWN
    centerElement: true
