appId: com.davidh216.gymmy
name: Start a training plan session
---
- runFlow: common/onboard.yaml
# Today is long and the floating tab bar covers its bottom edge, so half-visible counts.
- scrollUntilVisible:
    element: ".*HYROX Prep.*"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 50
- tapOn: ".*HYROX Prep.*"
- tapOn: "Start this plan"
- assertVisible: ".*Week 1 of 8.*"
- tapOn:
    id: "plan-day-1-start"
- assertVisible: ".*3 × 8.*"
- assertVisible:
    id: "set-1-reps"
