# Fresh install through onboarding to the Today screen.
appId: com.davidh216.gymmy
---
- launchApp:
    clearState: true
- tapOn: "Let's go"
# The name field focuses itself on slow runs, which hides its placeholder.
- tapOn:
    text: "Your name"
    optional: true
- inputText: "Alex"
# Return usually submits the name; when it doesn't, Continue does. Tap until the companion pick shows.
- pressKey: Enter
- repeat:
    while:
      notVisible: "Start with Kong"
    times: 3
    commands:
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 10000
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "Start with Kong"
    timeout: 10000
- tapOn: "Start with Kong"
# The header is always on screen; buttons further down may need a scroll.
- extendedWaitUntil:
    visible:
      id: "today"
    timeout: 15000
