# Fresh install through onboarding to the Today screen.
appId: com.davidh216.gymmy
---
- launchApp:
    clearState: true
- tapOn: "Let's go"
# The name field focuses itself on slow runs, which hides its placeholder.
- tapOn:
    text: "Your name"
    optional: true
- inputText: "Alex"
# Return usually submits the name; when it doesn't, Continue does. Tap Continue through the buddy,
# hatch and "what brings you here" steps until the last step (goal and units) shows.
- pressKey: Enter
- repeat:
    while:
      notVisible: "Start with Kong"
    times: 6
    commands:
      # The first flow of a run starts on a cold simulator, so allow a slow step.
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 20000
      - tapOn: "Continue"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible: "Start with Kong"
    timeout: 10000
# The weekly goal has no default; picking it is the commitment.
- tapOn:
    id: "goal-3"
- tapOn: "Start with Kong"
# The header is always on screen; buttons further down may need a scroll.
- extendedWaitUntil:
    visible:
      id: "today"
    timeout: 15000
