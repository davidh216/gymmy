# Fresh install through onboarding to the Today screen.
appId: com.davidh216.gymmy
---
- launchApp:
    clearState: true
- tapOn: "Let's go"
- tapOn: "Your name"
- inputText: "Alex"
# Return submits the name and moves on (hideKeyboard may press Return too, skipping a step).
- pressKey: Enter
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Start with Kong"
    timeout: 10000
- tapOn: "Start with Kong"
# The header is always on screen; buttons further down may need a scroll.
- extendedWaitUntil:
    visible:
      id: "today"
    timeout: 15000
